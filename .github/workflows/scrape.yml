name: Scrape Businesses

on:
  workflow_dispatch:
    inputs:
      niche:
        description: 'Business niche (e.g. "fitness gym", "IT", "dentist", "real estate")'
        required: true
        type: string
      location:
        description: 'City, Region (e.g. "Berlin, Germany" or "Dubai, UAE")'
        required: true
        type: string
      limit:
        description: 'Target number of successful results'
        required: false
        default: '500'
        type: string
      workers:
        description: 'Parallel workers (default 30)'
        required: false
        default: '30'
        type: string
      pages:
        description: 'Pages to check per site (default 6)'
        required: false
        default: '6'
        type: string

env:
  PYTHONUNBUFFERED: 1

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max (GitHub limit)
    permissions:
      contents: write  # needed for the commit-back step

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Business Finder
        run: |
          python business_finder.py \
            --limit "${{ inputs.limit }}" \
            "${{ inputs.niche }}" \
            "${{ inputs.location }}"
        env:
          MAX_WORKERS: ${{ inputs.workers }}
          MAX_PAGES_PER_SITE: ${{ inputs.pages }}

      - name: Clean results with Super Clean
        run: |
          # Scrub junk emails and drop companies with no valid email.
          # Overwrites the finder's CSV in place, so the committed file
          # is the cleaned list (the sender then uses the same file).
          python super_clean.py --in-place --csv-dir .

      - name: Upload CSV results (artifact - download from Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: businesses-${{ github.run_id }}
          path: "*.csv"
          retention-days: 30
          if-no-files-found: warn

      - name: Commit CSVs back to repository
        run: |
          # Stop early when the finder produced no CSVs.
          shopt -s nullglob
          csv_files=(*.csv)
          if [ "${#csv_files[@]}" -eq 0 ]; then
            echo "No CSV files found - nothing to commit."
            exit 0
          fi

          # Configure git for the commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the CSVs
          git add -- *.csv

          # Commit only when there is something to commit. The message is fed
          # through stdin (-F -) so the niche/location text and the [skip ci]
          # marker can never be parsed as git arguments or pathspecs.
          if ! git diff --cached --quiet; then
            printf 'Add CSV results for %s / %s [skip ci]\n' "$NICHE" "$LOCATION" | git commit -F -
            git push
            echo "Committed and pushed CSV results."
          else
            echo "No changes to commit - CSVs already up to date."
          fi
        env:
          NICHE: ${{ inputs.niche }}
          LOCATION: ${{ inputs.location }}
