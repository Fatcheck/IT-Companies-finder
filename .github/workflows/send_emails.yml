name: Send Emails

on:
  workflow_dispatch:
    inputs:
      csv_file:
        description: 'Path to the CSV file with contacts (e.g. businesses.csv, or the CSV committed by the Scrape workflow)'
        required: true
        type: string
      preview:
        description: 'Preview mode — show what would be sent, send nothing'
        required: false
        default: true
        type: boolean
      limit:
        description: 'Max emails to send (0 = unlimited)'
        required: false
        default: '10'
        type: string
      subject:
        description: 'Subject template (e.g. "Business opportunity for {company}")'
        required: false
        default: 'Business opportunity for {company}'
        type: string
      niche:
        description: 'Business niche used in the email template (e.g. "fitness", "real estate", "IT")'
        required: false
        default: ''
        type: string
      verify:
        description: 'Check each email exists (MX + SMTP) before sending — prevents "Address not found" bounces'
        required: false
        default: true
        type: boolean
      verify_strict:
        description: 'Also drop emails the mail server would not confirm (fewest bounces, may lose some leads)'
        required: false
        default: false
        type: boolean
      delay_min:
        description: 'Min delay in seconds between sends'
        required: false
        default: '30'
        type: string
      delay_max:
        description: 'Max delay in seconds between sends'
        required: false
        default: '60'
        type: string

env:
  PYTHONUNBUFFERED: 1

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max (GitHub limit)
    permissions:
      contents: write  # needed for the commit-back step

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The sender only uses the Python standard library (smtplib, email, csv)
      # so no pip install is required.

      - name: Verify emails (deliverability check)
        if: inputs.verify
        run: |
          # Check MX records + SMTP mailbox existence so we only send to
          # addresses that can actually receive mail. The script writes
          # verified_<name>.csv next to the source (same dir), plus a report;
          # SEND_CSV then points the sender at the verified file.
          python verify_emails.py "${{ inputs.csv_file }}" ${{ inputs.verify_strict && '--strict' || '' }}
          SEND_CSV="$(dirname "${{ inputs.csv_file }}")/verified_$(basename "${{ inputs.csv_file }}")"
          echo "SEND_CSV=$SEND_CSV" >> "$GITHUB_ENV"

      - name: Use original CSV (verification off)
        if: ${{ !inputs.verify }}
        run: echo "SEND_CSV=${{ inputs.csv_file }}" >> "$GITHUB_ENV"

      - name: Run Email Sender
        run: |
          python gmail_email_sender.py \
            "$SEND_CSV" \
            --subject "${{ inputs.subject }}" \
            --niche "${{ inputs.niche }}" \
            --limit "${{ inputs.limit }}" \
            --delay-min "${{ inputs.delay_min }}" \
            --delay-max "${{ inputs.delay_max }}" \
            ${{ inputs.preview && '--preview' || '' }}
        env:
          # Unset secrets evaluate to empty strings, which would override the
          # preconfigured defaults in gmail_email_sender.py -- so fall back to
          # them explicitly (DEFAULT_SENDER / DEFAULT_APP_PASSWORD).
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER || 'forfewdollars@gmail.com' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD || 'mdtf qxjx moss pfxx' }}

      - name: Upload sent log (artifact - download from Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: sent-emails-log-${{ github.run_id }}
          path: "sent_emails_log.csv"
          retention-days: 30
          if-no-files-found: warn

      - name: Commit sent log back to repository
        run: |
          # Only commit when a log file was actually produced
          ls sent_emails_log.csv 2>/dev/null || exit 0

          # Configure git for the commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add and commit the log (skip push if nothing changed)
          git add sent_emails_log.csv
          git diff --cached --quiet && exit 0
          git commit -m "Update sent emails log [skip ci]"
          git push
