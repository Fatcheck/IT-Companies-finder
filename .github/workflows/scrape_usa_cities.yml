name: Scrape Businesses - USA Cities (whole list)

on:
  workflow_dispatch:
    inputs:
      niche:
        description: 'Business niche (e.g. "IT", "software", "fitness gym")'
        required: false
        default: 'IT'
        type: string
      limit:
        description: 'Companies to find PER CITY — every city in the list gets up to this many rows with emails'
        required: false
        default: '500'
        type: string
      cities:
        description: 'City list — a file name like USA_Cities.txt (one city per line, committed to the repo) OR a ";" separated inline list (e.g. "Austin, Texas; Seattle, Washington"). Leave empty to use USA_Cities.txt if present, else the built-in list'
        required: false
        default: ''
        type: string
      start_city:
        description: 'Skip the first N cities (resume a partial run)'
        required: false
        default: '0'
        type: string
      max_cities:
        description: 'Only process the first N cities (0 = all)'
        required: false
        default: '0'
        type: string
      chunks:
        description: 'Split the city list across N PARALLEL jobs. The 6h per-job timeout cannot scrape all 79 cities in one job (~9h total), so the list is split round-robin across N jobs (default 4).'
        required: false
        default: '4'
        type: string
      workers:
        description: 'Parallel website workers — the #1 SPEED knob. Scraping is network-bound, so 60 is a safe 2x over the old 30. Raise to 100+ for even faster runs; lower if sites rate-limit (default 60)'
        required: false
        default: '60'
        type: string
      pages:
        description: 'Pages to check per site — a COVERAGE knob, not a speed knob. Emails live on contact/impressum pages; cutting below ~10 loses emails. Keep 15 for full coverage (default 15)'
        required: false
        default: '15'
        type: string
      pool:
        description: 'Candidate pool multiplier per city — a COVERAGE knob. Cities are candidate-starved (most fill far under 500), so cutting this below 4 reduces rows. Keep 4 (default 4)'
        required: false
        default: '4'
        type: string
      scrape_delay:
        description: 'Seconds between website page requests — a SPEED knob. 0.2 is ~40% faster than 0.35 with modest rate-limit risk; raise if sites start blocking (default 0.2)'
        required: false
        default: '0.2'
        type: string
      skip_existing:
        description: 'Skip cities whose CSV is already committed (auto-resume a partial run)'
        required: false
        default: true
        type: boolean

env:
  PYTHONUNBUFFERED: 1

# One scrape run at a time — parallel runs would race on the git push.
concurrency:
  group: scrape-usa-cities
  cancel-in-progress: false

jobs:
  # Computes the chunk numbers [1..N] so the matrix below can fan out.
  prep:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.gen.outputs.chunks }}
    steps:
      - name: Generate chunk list
        id: gen
        run: |
          CHUNKS="${{ inputs.chunks }}"
          if ! [[ "$CHUNKS" =~ ^[1-9][0-9]*$ ]] || [ "$CHUNKS" -gt 20 ]; then
            echo "::error::chunks must be an integer between 1 and 20, got '$CHUNKS'"
            exit 1
          fi
          # chunks=[1,2,...,N] as a JSON array for strategy.matrix
          echo "chunks=[$(seq -s, 1 "$CHUNKS")]" >> "$GITHUB_OUTPUT"

  scrape:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours — GitHub's hard cap for hosted runners
    permissions:
      contents: write  # needed for the commit-back step
    strategy:
      fail-fast: false   # one bad chunk must not cancel the others
      matrix:
        chunk: ${{ fromJSON(needs.prep.outputs.chunks) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Business Finder (chunk ${{ matrix.chunk }} of ${{ inputs.chunks }})
        run: |
          # Build the --cities args only when the input is not empty. A bash
          # array is used so semicolons/spaces in the city list survive
          # word-splitting correctly (each city like "Austin, Texas" stays one
          # argument).
          CITIES_ARGS=()
          if [ -n "${{ inputs.cities }}" ]; then
            CITIES_ARGS+=(--cities "${{ inputs.cities }}")
          fi

          SKIP_EXISTING_ARGS=()
          if [ "${{ inputs.skip_existing }}" = "true" ]; then
            SKIP_EXISTING_ARGS+=(--skip-existing)
          fi

          python business_finder_usa_cities.py \
            --limit "${{ inputs.limit }}" \
            --niche "${{ inputs.niche }}" \
            --start-city "${{ inputs.start_city }}" \
            --max-cities "${{ inputs.max_cities }}" \
            --chunk "${{ matrix.chunk }}" \
            --chunks "${{ inputs.chunks }}" \
            "${SKIP_EXISTING_ARGS[@]}" \
            "${CITIES_ARGS[@]}"
        env:
          MAX_WORKERS: ${{ inputs.workers }}
          MAX_PAGES_PER_SITE: ${{ inputs.pages }}
          POOL_MULTIPLIER: ${{ inputs.pool }}
          SCRAPE_DELAY: ${{ inputs.scrape_delay }}
          # Optional: add a free HERE API key (developer.here.com, 30k req/mo)
          # as a repository secret named HERE_API_KEY to unlock more candidate
          # businesses per city (they come with websites attached).
          HERE_API_KEY: ${{ secrets.HERE_API_KEY }}

      - name: Clean results with Super Clean
        run: |
          # Scrub junk emails and drop companies with no valid email.
          # Overwrites every finder CSV in place, so the committed files are
          # the cleaned lists (the sender then uses the same files).
          python super_clean.py --in-place --csv-dir .

      - name: Upload CSV results (artifact - download from Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: businesses-usa-cities-chunk-${{ matrix.chunk }}-${{ github.run_id }}
          path: "businesses_*.csv"
          retention-days: 30
          if-no-files-found: warn

      - name: Commit CSVs back to repository (chunk ${{ matrix.chunk }})
        run: |
          # Stop early when the finder produced no CSVs.
          shopt -s nullglob
          csv_files=(businesses_*.csv)
          if [ "${#csv_files[@]}" -eq 0 ]; then
            echo "No CSV files found - nothing to commit."
            exit 0
          fi

          # Configure git for the commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the CSVs
          git add -- businesses_*.csv

          # Commit only when there is something to commit. The message is fed
          # through stdin (-F -) so the niche text and the [skip ci] marker
          # can never be parsed as git arguments or pathspecs.
          if git diff --cached --quiet; then
            echo "No changes to commit - CSVs already up to date."
            exit 0
          fi

          printf 'Add CSV results for %s / USA cities list (chunk %s/%s) [skip ci]\n' \
            "$NICHE" "$MATRIX_CHUNK" "$MATRIX_CHUNKS" | git commit -F -

          # Parallel chunks push at the same time — pull --rebase first so a
          # non-fast-forward push never fails the whole job. Retry the whole
          # pull+push cycle: another chunk may push while we rebase (conflicts
          # are impossible — every chunk writes its own distinct CSVs).
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "$GITHUB_REF_NAME" 2>/dev/null
            if git push origin "$GITHUB_REF_NAME" 2>/dev/null; then
              echo "Committed and pushed CSV results for chunk $MATRIX_CHUNK."
              exit 0
            fi
            echo "Push needed a retry (attempt $attempt) - another chunk pushed."
            sleep 10
          done
          echo "::error::Could not push after 5 attempts."
          exit 1
        env:
          NICHE: ${{ inputs.niche }}
          MATRIX_CHUNK: ${{ matrix.chunk }}
          MATRIX_CHUNKS: ${{ inputs.chunks }}
